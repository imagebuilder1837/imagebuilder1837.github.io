# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: imagebuilder1837
description: imagebuilder1837 的个人博客，记录技术实践、ACGN 观后感与教育、社会议题随想，也收录译文、马前卒课程转写及转载。
author: imagebuilder1837
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://imagebuilder1837.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - google17db084228384126.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: true
  strip_indent: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Keep these indexes complete independently of home/global pagination.
archive_generator:
  per_page: 0
category_generator:
  per_page: 0

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'empty'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: clover-evo
# Site-owned Clover Evo identity and navigation (merged with the theme defaults).
theme_config:
  nav:
    title: imagebuilder1837
  favicon: /images/avatar.ico
  social:
    Bangumi: https://bgm.tv/user/imagebuilder183
    GitHub: https://github.com/imagebuilder1837
    Zhihu: https://www.zhihu.com/people/imagebuilder1837
    bilibili: https://space.bilibili.com/366719977
    RSS: /atom.xml
  mail: imagebuilder1837@outlook.com
  copyright: This blog by <a href="/" target="_blank">imagebuilder1837</a> is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>
  code_copy: true
  menu:
    Home: /
    Archive: /archives/
    Category: /categories/
    Tag: /tags/
    About: /about/
plugins:
  hexo-generator-feed
# Feed Atom
feed:
  type: atom
  path: atom.xml
  limit: 20
