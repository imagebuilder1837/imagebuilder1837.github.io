name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

# Serialize operations per PR, without treating cancellation as a content lock.
concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'imagebuilder1837/imagebuilder1837.github.io' &&
      github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
    steps:
      # Only trusted default-branch code/dependencies are used, never the PR ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ github.token }}
      - name: Check the limited update scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: node .github/scripts/dependabot-scope.cjs validate

  manage-auto-merge:
    needs: validate
    # Failed validation must also revoke a previously enabled auto-merge request.
    if: >-
      always() && !cancelled() &&
      github.repository == 'imagebuilder1837/imagebuilder1837.github.io' &&
      github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # No installation or execution of PR code in this write-capable job.
      - name: Enable eligible updates or confirm auto-merge is disabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ELIGIBLE: ${{ needs.validate.result == 'success' && needs.validate.outputs.eligible == 'true' }}
          AUTOMERGE_ENABLED: ${{ vars.DEPENDABOT_AUTOMERGE_ENABLED }}
        run: node .github/scripts/dependabot-scope.cjs manage
