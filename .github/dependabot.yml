version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      routine-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
